<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ULU Radiant Defense — Lifestyle Product Photo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1A1410;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      padding: 40px 20px;
    }
    .frame {
      max-width: 1200px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 8px 24px rgba(0,0,0,0.4);
      border-radius: 4px;
      overflow: hidden;
      line-height: 0;
    }
    .frame img, .frame svg, .frame object {
      width: 100%;
      height: auto;
      display: block;
    }
    .caption {
      margin-top: 24px;
      color: #8A7060;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img src="lifestyle-product-photo.svg" alt="ULU Radiant Defense Antioxidant Cream — Lifestyle Product Photo"/>
  </div>
  <p class="caption">ULU Radiant Defense &nbsp;·&nbsp; Lifestyle Product Photo</p>
</body>
</html>
